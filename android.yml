{
 "name": "Build Android APK",
 "on": {"workflow_dispatch": {}, "push": {"tags": ["v*"]}},
 "jobs": {"apk": {"runs-on": "ubuntu-latest", "steps": [
  {"uses": "actions/checkout@v4"},
  {"uses": "actions/setup-node@v4", "with": {"node-version": 20}},
  {"uses": "actions/setup-java@v4", "with": {"distribution": "temurin", "java-version": 17}},
  {"name": "Prepare web assets", "run": "mkdir www\ncp index.html manifest.webmanifest sw.js icon-192.png icon-512.png maskable-512.png www/"},
  {"run": "npm install"},
  {"run": "npx cap add android"},
  {"run": "npx cap sync android"},
  {"name": "Build debug APK", "working-directory": "android", "run": "./gradlew assembleDebug"},
  {"uses": "actions/upload-artifact@v4", "with": {"name": "daftar-apk", "path": "android/app/build/outputs/apk/debug/app-debug.apk"}}
 ]}}
}
